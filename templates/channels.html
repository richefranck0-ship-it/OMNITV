{% extends "base.html" %}
{% block title %}Toutes les Chaînes – OMNITv{% endblock %}
{% block content %}
<div class="page-container">
  <h1 class="page-title">Chaînes de Télévision</h1>
  <p class="page-subtitle">Accédez à l'ensemble des chaînes diffusées en direct sur OMNITv.</p>
  <div class="channels-grid">
    {% for ch in channels %}
    <a href="/live?channel={{ ch.id }}" class="channel-grid-card">
      <img src="{{ ch.logo_url }}" alt="{{ ch.name }}" class="ch-grid-logo" />
      <h4 class="ch-grid-name">{{ ch.name }}</h4>
      <span class="ch-grid-cat">{{ ch.category }}</span>
      <span class="ch-grid-live">● EN DIRECT</span>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
