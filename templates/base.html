<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OMNITV — THE WORLD. ONE SCREEN.{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="top"><a class="brand" href="{{ url_for('home') }}">OMNI<span>TV</span></a><nav><a href="{{ url_for('direct') }}">Direct</a><a href="{{ url_for('programme') }}">Programme TV</a><a href="{{ url_for('broadcaster') }}">Diffuseur</a><a href="{{ url_for('advertising') }}">Publicité</a><a href="{{ url_for('admin_login') }}">Admin</a></nav></header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>OMNITV · THE WORLD. ONE SCREEN. · <a href="mailto:{{ 'richefranck0@gmail.com' }}">Nous contacter</a></footer></body></html>
