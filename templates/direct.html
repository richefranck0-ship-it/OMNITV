{% extends "base.html" %}
{% block title %}Direct TV & Studio Live — OMNITv{% endblock %}
{% block content %}
<div class="space-y-6">
  <div class="border-b border-slate-200 pb-3">
    <h1 class="text-2xl font-extrabold text-slate-900 flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-rose-600 animate-pulse"></span>
      <span>Direct TV & Studio Broadcast</span>
    </h1>
    <p class="text-xs text-slate-500">Diffusion vidéo en temps réel continue et caméra studio.</p>
  </div>

  <div class="relative aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
    <video id="omnitv-live-player" controls autoplay playsinline class="w-full h-full object-contain"></video>
  </div>
</div>
{% endblock %}
