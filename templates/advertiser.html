{% extends "base.html" %}
{% block title %}Régie Publicitaire — OMNITv{% endblock %}
{% block content %}
<div class="space-y-8 max-w-4xl mx-auto">
  <div class="text-center space-y-2">
    <span class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-700">Régie Pub OMNITv</span>
    <h1 class="text-3xl font-extrabold text-slate-900">Diffusez votre Marque auprès de 1M de Spectateurs</h1>
    <p class="text-xs text-slate-600">Spots vidéos MP4, bannières latérales et sponsoring du direct.</p>
  </div>

  <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm space-y-4">
    <h3 class="text-lg font-bold text-slate-900">Nous contacter pour les publicités</h3>
    <form class="space-y-3 text-xs" onsubmit="event.preventDefault(); alert('Demande de campagne reçue ! Notre équipe vous répondra sous 24h.');">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input required type="text" placeholder="Nom de l'entreprise" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
        <input required type="email" placeholder="Email professionnel" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
      </div>
      <textarea rows="3" placeholder="Description de la campagne..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2"></textarea>
      <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-xs transition">
        Envoyer la demande
      </button>
    </form>
  </div>
</div>
{% endblock %}
